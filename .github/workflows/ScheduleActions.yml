name: For Scheduled Actions

on:
  push:
    branches:
      - main

  schedule:
    - cron: 30 6 * * *

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
     - uses: actions/checkout@v6
     
     - name: running single command
       run: echo Inside build phase


  test:
    needs: build
    runs-on: ubuntu-latest

    steps:
    - name: running multiple commands
      run: |
        echo Hello World!
        echo Inside test phase


  deploy:
    needs: test
    runs-on: ubuntu-latest

    steps:
    - name: running single command
      run: echo Inside deploy phase
    
